<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Cormorant'; font-style: normal; font-weight: 300 700; src: url('../../node_modules/@fontsource-variable/cormorant/files/cormorant-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant'; font-style: italic; font-weight: 300 700; src: url('../../node_modules/@fontsource-variable/cormorant/files/cormorant-latin-wght-italic.woff2') format('woff2'); }
  @font-face { font-family: 'Instrument Sans'; font-weight: 400 700; src: url('../../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2') format('woff2'); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: #f4efe7; overflow: hidden; }
  .copy { position: absolute; left: 90px; top: 0; }
  .eyebrow { position: absolute; top: 121px; left: 0; white-space: nowrap; display: flex; align-items: center; gap: 16px; font: 500 15px 'Instrument Sans', sans-serif; letter-spacing: 0.235em; text-transform: uppercase; color: #5b5048; }
  .eyebrow::before { content: ''; width: 34px; height: 1px; background: #a9844e; }
  h1 { position: absolute; top: 162px; left: -4px; font: 400 150px/0.78 'Cormorant', serif; letter-spacing: -0.01em; color: #211c17; white-space: nowrap; }
  h1 span { display: block; }
  h1 em { font-style: italic; color: #8e4126; }
  .logo { position: absolute; top: 448px; left: 0; width: 330px; }
  .arch { position: absolute; left: 720px; top: 70px; width: 400px; height: 600px; border-radius: 200px 200px 0 0; overflow: hidden; }
  .arch img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
</style>
</head>
<body>
  <div class="copy">
    <p class="eyebrow">Gemstone jewelry and art · Chicago</p>
    <h1><span>Memory,</span><span>in <em>stone.</em></span></h1>
    <img class="logo" src="../../public/brand/simone-chagoya-lockup.svg" alt="" />
  </div>
  <div class="arch"><img src="../../src/assets/art/altered-beliefs.jpg" alt="" /></div>
</body>
</html>
